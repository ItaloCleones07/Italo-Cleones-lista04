<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Buscar CEP</title>
</head>
<body>
    <h1>Consultar CEP</h1>

    <form id="formulario">
        <label for="cep">CEP:</label>
        <input type="text" placeholder="Digite o CEP (ex:01001000)" maxlength="8" id="cep" name="cep" autocomplete="off">
        <button type="submit" id="buscar">Buscar Endereço</button>

        <p id="mensagem"></p>
    </form>

    <div id="endereco" hidden>
        <p>RUA: <span id="rua"></span></p>
        <p>BAIRRO: <span id="bairro"></span></p>
        <p>CIDADE: <span id="cidade"></span></p>
        <p>ESTADO: <span id="uf"></span></p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
